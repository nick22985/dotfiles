general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'  # to avoid having to press a key twice to turn on the display.
}

listener {
    timeout = 150                                # 2.5min.
    on-timeout = brightnessctl -s set 10         # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = brightnessctl -r                 # monitor backlight restore.
}

# turn off keyboard backlight; the wildcard matches rgb:kbd_backlight, dell::kbd_backlight, etc.
listener {
    timeout = 150                                          # 2.5min.
    on-timeout = brightnessctl -sd '*kbd_backlight' set 0  # turn off keyboard backlight.
    on-resume = brightnessctl -rd '*kbd_backlight'         # turn on keyboard backlight.
}

# Case lighting (cooler, RAM, board) goes dark with the display; rgb-lights does nothing without the rgb profile.
listener {
    timeout = 150                                 # 2.5min.
    on-timeout = rgb-lights off
    on-resume = rgb-lights on
}

listener {
    timeout = 300                                 # 5min
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

listener {
    timeout = 330                                 # 5.5min
    # The Lua config takes dispatchers as Lua; the old `dpms off` form no longer does anything.
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'  # screen off when timeout has passed
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'    # screen on when activity is detected after timeout has fired.
}

# Suspend only on battery; desktops have no mains supply, so this never fires there. Laptops name
# it AC, ACAD, ADP1 and so on, so look for any supply of type Mains that is offline.
listener {
    timeout = 900                                 # 15min
    # No shell variables here: hyprlang would read $name as one of its own.
    on-timeout = grep -qx 0 $(grep -lx Mains /sys/class/power_supply/*/type 2>/dev/null | sed 's/type$/online/') </dev/null 2>/dev/null && systemctl suspend
}
