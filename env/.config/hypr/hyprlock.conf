# Lock screen in the eww look: Catppuccin Macchiato, JetBrainsMono and the Hyprland
# border gradient on the password field.

$font = JetBrainsMono Nerd Font
$text = rgb(cad3f5)
$subtext = rgb(a5adcb)
$overlay = rgb(6e738d)
$accent = rgba(33ccffee) rgba(00ff99ee) 45deg

general {
    disable_loading_bar = true
    hide_cursor = true
}

# Fingerprint unlock runs alongside the password; without fprintd or a reader it stays unused.
auth {
    fingerprint:enabled = true
}

background {
    monitor =
    # A still of the last picked wallpaper, kept by ~/.local/bin/wallpaper
    path = ~/.cache/wallpaper/lock.jpg
    color = rgb(181926)
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.9
    brightness = 0.6
    vibrancy = 0.17
    vibrancy_darkness = 0.0
}

# Time
label {
    monitor =
    text = cmd[update:1000] date '+%-I:%M'
    color = $text
    font_size = 110
    font_family = $font ExtraBold
    position = 0, 200
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date '+%A %d %B'
    color = $subtext
    font_size = 20
    font_family = $font
    position = 0, 90
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    dots_size = 0.25 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.4 # Scale of dots' absolute size, -1.0 - 1.0
    dots_center = true
    dots_rounding = -1 # -1 default circle, -2 follow input-field rounding
    dots_fade_time = 200 # Milliseconds until a dot fully fades in
    outer_color = $accent
    inner_color = rgba(181926e6)
    font_color = $text
    font_family = $font # Font used for placeholder_text, fail_text and dots_text_format.
    fade_on_empty = false
    placeholder_text = <span foreground="##a5adcb">Password</span>
    hide_input = false
    rounding = -1 # -1 means complete rounding (circle/oval)
    check_color = rgb(eed49f)
    fail_color = rgb(ed8796) # if authentication failed, changes outer_color and fail message color
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i> # can be set to empty
    fail_timeout = 2000 # milliseconds before fail_text and fail_color disappears
    fail_transition = 300 # transition time in ms between normal outer_color and fail_color
    capslock_color = rgb(f5a97f)
    numlock_color = -1
    bothlock_color = -1 # when both locks are active. -1 means don't change outer color (same for above)
    invert_numlock = false # change color if numlock is off
    swap_font_color = false
    position = 0, -40
    halign = center
    valign = center
}

# Who is locked
label {
    monitor =
    text =   $USER
    color = $overlay
    font_size = 13
    font_family = $font
    position = 0, -110
    halign = center
    valign = center
}
