default-references = ["house"]
mounts = [ "~/projects/personal/sbx", "~/projects/personal/ijfmt:ro", "~/.config/ijfmt:ro" ]
container-home = "/home/nick"
allow-bare-repo = true
clipboard = true

[autoclaude]
templates = "~/projects/personal/house/templates"
notify = [ "idle", "exit", "input" ]
keepalive-hours = 5
keepalive-message = "hi"
self-update = true
auto-arm = true

[autoclaude.hub]
report-usage = true
remote-control = false

[agents]
build-slots = 2
accepts-work = true
priority = 1
cpu-pressure = 80
drain = false
forward-env = ["CODEX_API_KEY", "OPENAI_API_KEY", "FREEDCAMP_MCP_TOKEN"]

[agents.presets.opus-5-only]
about = "Claude Opus 5 for easy, normal, and hard work."
prefer = [ "claude" ]

[agents.presets.opus-5-only.models]
default = "normal"
allow = [ "claude-opus-5" ]

[agents.presets.opus-5-only.models.agent]
easy = "claude"
normal = "claude"
hard = "claude"

[agents.presets.opus-5-only.models.tier.easy]
claude = "claude-opus-5"

[agents.presets.opus-5-only.models.tier.normal]
claude = "claude-opus-5"

[agents.presets.opus-5-only.models.tier.hard]
claude = "claude-opus-5"

[agents.presets.sol-only]
about = "GPT-5.6 Sol for easy, normal, and hard work."
prefer = [ "codex" ]

[agents.presets.sol-only.models]
