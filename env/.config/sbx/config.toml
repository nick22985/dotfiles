normal = "codex"
hard = "codex"

[agents.presets.sol-only.models.tier.easy]
codex = "gpt-5.6-sol"

[agents.presets.sol-only.models.tier.normal]
codex = "gpt-5.6-sol"

[agents.presets.sol-only.models.tier.hard]
