set -ga terminal-overrides ",xterm-256color*:Tc"
set-option -a terminal-features ',xterm-256color:RGB'
set-option -ga terminal-features ',xterm*:osc7'
set-option -ga terminal-features ',alacritty*:osc7'
set-option -ga terminal-features ',ghostty*:osc7'
set-option -ga terminal-features ',kitty*:osc7'
set-option -ga terminal-features ',screen*:osc7'
set-option -ga terminal-features ',tmux*:osc7'
set-option -g default-terminal "screen-256color"
set -s escape-time 1
set -g history-limit 50000
set -g display-time 4000
set -g focus-events on
set -g aggressive-resize on
# image support
set -gq allow-passthrough on
set -g visual-activity off

set -g set-clipboard on

# no right-click context menus (pane, window/status bar, status left/right)
unbind -n MouseDown3Pane
unbind -n M-MouseDown3Pane
unbind -n MouseDown3Status
unbind -n M-MouseDown3Status
unbind -n MouseDown3StatusLeft
unbind -n M-MouseDown3StatusLeft
unbind -n MouseDown3StatusRight
# no floating pane from ctrl+drag (tmux 3.8 default)
unbind -n C-MouseDrag1Pane
unbind -n C-MouseDrag1Empty


unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix
# sessions attached over SSH switch to C-b (see tmux-ssh-prefix) so nested tmux works
bind-key C-b send-prefix
# bind-key c run-shell "tmux-ssh"


# hooks
# in SSH sessions (see tmux-sessionizer) new windows/splits connect to the host too
set-hook -g after-new-window 'run-shell "tmux-ssh-pane window #{pane_id}"'
set-hook -g after-split-window 'run-shell "tmux-ssh-pane split #{pane_id}"'
set-hook -g session-closed 'run-shell "~/.local/bin/tmux-on-closed \"#{hook_session_name}\""'
set-hook -g session-created 'run-shell "~/.local/bin/tmux-session-push #{hook_session_name}"'
set-hook -g client-session-changed 'run-shell "~/.local/bin/tmux-on-session-change #{client_session}"'
set-hook -ag session-created 'run-shell "~/.local/bin/tmux-ssh-prefix #{hook_session_name}"'
set-hook -ag client-session-changed 'run-shell "~/.local/bin/tmux-ssh-prefix #{client_session}"'
set-hook -g client-attached 'run-shell "~/.local/bin/tmux-ssh-prefix #{client_session}"'

# dont ask to kill window or pane
bind-key x kill-pane
bind-key & kill-window
bind Q run-shell "~/.local/bin/tmux-switch_and_kill.sh"

# tmux-windowizer "run" "tmux-run $3 $3"
set -g status-style 'bg=#333334 fg=#5eacd3'
set -g status-left-length 30

bind r source-file ~/.config/tmux/tmux.conf
set -g base-index 1

set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# vim-like text objects in copy mode: i/a then a quote, bracket (b B for ( {) or w, e.g. vi' or va(
bind -T copy-mode-vi i switch-client -T copy-mode-vi-inner
bind -T copy-mode-vi a switch-client -T copy-mode-vi-around
bind -T copy-mode-vi-inner "'" { send -X jump-backward "'" ; send -X cursor-right ; send -X begin-selection ; send -X jump-forward "'" ; send -X cursor-left }
bind -T copy-mode-vi-inner '"' { send -X jump-backward '"' ; send -X cursor-right ; send -X begin-selection ; send -X jump-forward '"' ; send -X cursor-left }
bind -T copy-mode-vi-inner '`' { send -X jump-backward '`' ; send -X cursor-right ; send -X begin-selection ; send -X jump-forward '`' ; send -X cursor-left }
bind -T copy-mode-vi-inner '<' { send -X jump-backward '<' ; send -X cursor-right ; send -X begin-selection ; send -X jump-forward '>' ; send -X cursor-left }
bind -T copy-mode-vi-inner '>' { send -X jump-backward '<' ; send -X cursor-right ; send -X begin-selection ; send -X jump-forward '>' ; send -X cursor-left }
bind -T copy-mode-vi-inner '(' { send -X jump-backward '(' ; send -X cursor-right ; send -X begin-selection ; send -X cursor-left ; send -X next-matching-bracket ; send -X cursor-left }
bind -T copy-mode-vi-inner ')' { send -X jump-backward '(' ; send -X cursor-right ; send -X begin-selection ; send -X cursor-left ; send -X next-matching-bracket ; send -X cursor-left }
bind -T copy-mode-vi-inner b { send -X jump-backward '(' ; send -X cursor-right ; send -X begin-selection ; send -X cursor-left ; send -X next-matching-bracket ; send -X cursor-left }
bind -T copy-mode-vi-inner '[' { send -X jump-backward '[' ; send -X cursor-right ; send -X begin-selection ; send -X cursor-left ; send -X next-matching-bracket ; send -X cursor-left }
bind -T copy-mode-vi-inner ']' { send -X jump-backward '[' ; send -X cursor-right ; send -X begin-selection ; send -X cursor-left ; send -X next-matching-bracket ; send -X cursor-left }
bind -T copy-mode-vi-inner '{' { send -X jump-backward '{' ; send -X cursor-right ; send -X begin-selection ; send -X cursor-left ; send -X next-matching-bracket ; send -X cursor-left }
bind -T copy-mode-vi-inner '}' { send -X jump-backward '{' ; send -X cursor-right ; send -X begin-selection ; send -X cursor-left ; send -X next-matching-bracket ; send -X cursor-left }
bind -T copy-mode-vi-inner B { send -X jump-backward '{' ; send -X cursor-right ; send -X begin-selection ; send -X cursor-left ; send -X next-matching-bracket ; send -X cursor-left }
bind -T copy-mode-vi-inner w { send -X select-word }
bind -T copy-mode-vi-around "'" { send -X jump-backward "'" ; send -X begin-selection ; send -X jump-forward "'" }
bind -T copy-mode-vi-around '"' { send -X jump-backward '"' ; send -X begin-selection ; send -X jump-forward '"' }
bind -T copy-mode-vi-around '`' { send -X jump-backward '`' ; send -X begin-selection ; send -X jump-forward '`' }
bind -T copy-mode-vi-around '<' { send -X jump-backward '<' ; send -X begin-selection ; send -X jump-forward '>' }
bind -T copy-mode-vi-around '>' { send -X jump-backward '<' ; send -X begin-selection ; send -X jump-forward '>' }
bind -T copy-mode-vi-around '(' { send -X jump-backward '(' ; send -X begin-selection ; send -X next-matching-bracket }
bind -T copy-mode-vi-around ')' { send -X jump-backward '(' ; send -X begin-selection ; send -X next-matching-bracket }
bind -T copy-mode-vi-around b { send -X jump-backward '(' ; send -X begin-selection ; send -X next-matching-bracket }
bind -T copy-mode-vi-around '[' { send -X jump-backward '[' ; send -X begin-selection ; send -X next-matching-bracket }
bind -T copy-mode-vi-around ']' { send -X jump-backward '[' ; send -X begin-selection ; send -X next-matching-bracket }
bind -T copy-mode-vi-around '{' { send -X jump-backward '{' ; send -X begin-selection ; send -X next-matching-bracket }
bind -T copy-mode-vi-around '}' { send -X jump-backward '{' ; send -X begin-selection ; send -X next-matching-bracket }
bind -T copy-mode-vi-around B { send -X jump-backward '{' ; send -X begin-selection ; send -X next-matching-bracket }

bind -r ^ run-shell "~/.local/bin/tmux-session-jump back"
bind -r Tab run-shell "~/.local/bin/tmux-session-jump forward"

# vim-like pane switching
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# vim-like pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# bind -r D neww -c "#{pane_current_path}" "[[ -e TODO.md ]] && nvim TODO.md || nvim ~/.dotfiles/personal/todo.md"

# forget the find window.  That is for chumps
# sessionizer opens in a popup; set to "window" to open it in a new window instead
set -g @sessionizer_mode popup
bind-key f if-shell -F "#{==:#{@sessionizer_mode},window}" \
    "new-window ~/.local/bin/tmux-sessionizer" \
    "display-popup -E -w 80% -h 70% ~/.local/bin/tmux-sessionizer"

bind-key -r i run-shell "tmux neww tmux-cht.sh"

# In a session that's bound to an SSH host (TMUX_SSH_HOST set by
# tmux-sessionizer), open a new window running local nvim browsing the
# current pane's remote dir via oil-ssh://.
bind-key E run-shell "tmux-ssh-nvim #{pane_id}"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @plugin 'b0o/tmux-autoreload'

# run ~/.config/tmux/plugins/catppuccin/catppuccin.tmux
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @catppuccin_flavor "mocha"

# popups (sessionizer) match catppuccin mocha instead of tmux's default grey box
set -g popup-style 'bg=#1e1e2e'
set -g popup-border-style 'fg=#89b4fa,bg=#1e1e2e'
set -g popup-border-lines rounded

set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_status_background "#242638"
set -g @catppuccin_directory_text ""

set -g @catppuccin_window_current_text "#W"
set -g @catppuccin_window_text "#W"

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -gF status-right ""
set -ag status-right "#{E:@catppuccin_status_session}"
set -agF status-right "#{E:@catppuccin_status_battery}"
set -ag status-right "#{E:@catppuccin_status_application}"

set -g status-interval 5

run '~/.config/tmux/plugins/tpm/tpm'
